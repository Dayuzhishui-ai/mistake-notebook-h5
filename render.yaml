services:
  - type: web
    name: mistake-notebook
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
